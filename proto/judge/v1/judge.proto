syntax = "proto3";

package jot.judge.v1;

service JudgeService {
  rpc Judge(JudgeRequest) returns (stream JudgeEvent);
}

message JudgeRequest {
  // Set by the backend to correlate the request, stream, and logs.
  int64 request_id = 1;
  int64 problem_id = 2;
  Language language = 3;
  string source_code = 4;
  uint64 compile_time_ms_limit = 5;
  uint64 build_artifact_bytes_limit = 6;
  uint64 instruction_count_limit = 7;
  uint64 memory_bytes_limit = 8;
  
}

enum Language {
  LANGUAGE_C = 0;
  LANGUAGE_CPP = 1;
  LANGUAGE_RUST = 2;
  LANGUAGE_GO = 3;
  LANGUAGE_PYTHON = 4;
}

// Output

message JudgeEvent {
  int64 request_id = 1;

  oneof payload {
    JudgeReceived received = 2;
    JudgeCompiling compiling = 3;
    JudgeFetchingTestCasesMetadata fetching_test_cases_metadata = 4;
    JudgeRunning running = 5;
    JudgeFinishing finishing = 6;
    JudgeResult result = 7;
  }
}

message JudgeReceived {
}

message JudgeCompiling {
}

message JudgeFetchingTestCasesMetadata {
}

message JudgeRunning {
  uint32 completed_cases = 2;
  uint32 total_cases = 3;
}

message JudgeFinishing {
}

message JudgeResult {
  oneof verdict {
    JudgeComplete complete = 1;
    JudgeWrongAnswer wrong_answer = 2;
    JudgeCompileError compile_error = 3;
    JudgeCompileTLE compile_tle = 4;
    JudgeCompileBLE compile_ble = 5;
    JudgeTLE time_limit_exceeded = 6;
    JudgeMLE memory_limit_exceeded = 7;
    JudgeBLE build_artifact_limit_exceeded = 8;
    JudgeSystemError system_error = 9;
  }
}

message JudgeComplete {
  uint32 correct_subproblems = 1;
  uint32 total_subproblems = 2;
  uint64 instruction_count = 3;
  uint64 memory_bytes = 4;
}

message JudgeWrongAnswer {
  string message = 1;
}

message JudgeCompileError {
  string compiler_diagnostics = 1;
}

message JudgeCompileTLE {
  uint64 max_compile_time_ms = 1;
}

message JudgeCompileBLE {
  uint64 max_build_artifact_bytes = 1;
}

message JudgeTLE {
  uint64 max_instruction_count = 1;
}

message JudgeMLE {
  uint64 max_memory_bytes = 1;
}

message JudgeBLE {
  uint64 max_build_artifact_bytes = 1;
}

message JudgeSystemError {
  string error_message = 1;
}